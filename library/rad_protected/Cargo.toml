cargo-features = ["public-dependency"]

[package]
name = "rad_protected"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/rad-rust/rust.git"
description = "Runtime support for Rad-Rust Software TMR"

[lib]
crate-type = ["rlib"]

[dependencies]
core = { path = "../core", public = true }
alloc = { path = "../alloc", public = true }
compiler_builtins = { path = "../compiler-builtins/compiler-builtins", features = ["rustc-dep-of-std"] }

[target.'cfg(not(all(windows, target_env = "msvc")))'.dependencies]
libc = { version = "0.2.178", default-features = false, features = [
    'rustc-dep-of-std',
], public = true }

[lints.rust.unexpected_cfgs]
level = "warn"
